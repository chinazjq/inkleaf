[package]
name = "inkleaf"
version = "0.1.0"
description = "Inkleaf (墨页) — a calm Markdown reader and editor"
authors = ["Inkleaf contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "inkleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.8"
encoding_rs = "0.8"
chardetng = "1"
sys-locale = "0.3"
dunce = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
